server.port=8080

# Base de datos Relacional en Memoria (H2) con datos estaticos cargados en codigo
spring.datasource.url=jdbc:h2:mem:guarderia_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (opcional para inspeccion visual en navegador: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de Seguridad y Token JWT
app.jwt.secret=4a625977326e576356774c585047724a4f4831613554557962456a6c42504936
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200
